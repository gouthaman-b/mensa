[project]
name = "mensa"
version = "0.1.0"
description = "A CLI tool to browse mensa meals from studentwerk dortmund and find an optimal meal plan(ILP)"
readme = "README.md"
authors = [
    { name = "gouthaman-b", email = "gouthaman.b@outlook.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pathvalidate>=3.3.1",
    "platformdirs>=4.11.11",
    "pulp[cbc]>=3.3.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
mensa = "mensa:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"
